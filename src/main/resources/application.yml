server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:internships;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug

app:
  jwt:
    # Signing key for login tokens (HMAC, at least 32 bytes). Set JWT_SECRET in any real
    # deployment. Unset, a random key is made at startup, so tokens end on restart.
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
